<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier: Ring Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 120% at 50% 0%, #16213f 0%, #0b1020 70%); }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
